name: Описание выпуска

# Обновляет описание уже выпущенной версии из CHANGELOG.md основной ветки (раздел «## <версия> »).
# Запуск вручную: gh workflow run release-notes.yml -f version=0.5.0
# Строка о сборке («Сборка … от …. Скачать: …») из прежнего описания сохраняется.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без «v», например 0.5.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Описание из CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Версия «$V» не в виде 0.5.0"; exit 1; }
          awk -v v="## $V " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::В CHANGELOG.md нет раздела «## $V »"; exit 1; }
          gh release view "v$V" --json body --jq .body > old.md
          # Хвост прежнего описания после строки «---» (сведения о сборке и ссылка на файл) — без изменений.
          if grep -qx -- '---' old.md; then
            printf '\n' >> notes.md
            awk 'f{print} /^---$/{f=1; print}' old.md >> notes.md
          fi
          gh release edit "v$V" --notes-file notes.md
          echo "::notice title=Описание выпуска::v$V обновлено из CHANGELOG.md"
