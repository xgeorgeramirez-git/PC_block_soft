# Дешёвые проверки на Linux на каждое изменение (лестница R0–R2) и снимки экранов в браузере.
# Windows-машина здесь не нужна: сборка для Windows проверяется кросс-компиляцией.
name: Проверки

on:
  push:
    branches: [main, "feature/**", "fix/**", "build/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      st1:
        description: "Проба ST1: скорость базы (NFR-13), отдельный шаг без -race"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: R0–R2 статика и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Фронт — зависимости, типы, тесты, сборка
        working-directory: frontend
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          npm ci
          npm run typecheck
          npx vitest run
          npx vite build

      # В сборку идут только 17 стикеров промокода (RM5b-8). До T8 стикеров в окне нет: проверка «не больше 17»;
      # T8 включает --tgs-exact 17 --player.
      - name: Сборка фронта — стикеры и проигрыватель
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash tools/check-dist.sh --tgs-exact 17 --player frontend/dist

      # В облачной песочнице агента прокси модулей Go закрыт, поэтому go.sum обновляет CI:
      # в рабочей ветке сборка сама коммитит результат go mod tidy (как схему базы в Android-проекте).
      # Коммит от github-actions новых проверок не запускает — эта же сборка продолжает уже с ним.
      - name: go.mod и go.sum — в рабочей ветке обновить и закоммитить
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "build: обновить go.mod и go.sum (go mod tidy)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice title=go.sum::go.mod/go.sum обновлены и закоммичены в ветку — сделайте git pull"
          fi
      - name: go.mod и go.sum в main и Pull Request должны быть в порядке
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if ! go mod tidy -diff; then
            echo "::error title=go.sum::go.mod/go.sum не в порядке: запушьте рабочую ветку — CI обновит их сам"
            exit 1
          fi

      - name: gofmt
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "::error title=gofmt::Не отформатированы: $out"; exit 1; fi

      - name: Без сетевых пакетов (NFR-1)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash tools/check_imports.sh

      - name: Тексты интерфейса без длинных тире
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          python3 tools/scan_ui_texts.py

      # Свои шаблоны установщика (build/windows/installer): UTF-8 с BOM, иначе кириллица в установщике бьётся;
      # комментарий не оканчивается обратной чертой, иначе NSIS теряет следующую строку.
      - name: Шаблоны NSIS в UTF-8 с BOM
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash tools/check_nsis_bom.sh

      - name: go vet и сборка для Windows (кросс-компиляция)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go vet -tags desktop,production ./...
          go build -tags desktop,production -o /tmp/PCBlock.exe .

      - name: Тесты Go с гонками (всё, кроме связки окна)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go test -race -count=1 $(go list ./... | grep -v -E '/internal/ui$' | grep -v -E '^pcblock$')

      # Проба ST1 (RM5-7) — только при ручном запуске с -f st1=true (на push и PR входов нет, шаг
      # пропускается). Без -race и покрытия; итог — пометкой ::notice (журналы из песочницы не читаются).
      - name: ST1 (по запросу)
        if: inputs.st1 == true
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash tools/test-series.sh --st1-only

      - name: Кодовая карта актуальна (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash tools/codemap.sh
          if ! git diff --quiet -- docs/CODEMAP.md; then
            git diff -- docs/CODEMAP.md | head -40
            echo "::error title=CODEMAP::Карта устарела: запусти bash tools/codemap.sh и закоммить docs/CODEMAP.md"
            exit 1
          fi
      - name: Ошибки — в пометки сборки (их видно без журнала)
        if: failure()
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Проверки"

  # Сервер связи (M7, T1/T2): отдельный модуль cmd/pcblock-relay (go 1.24, без зависимостей) и его
  # образ deploy/relay/Dockerfile. Корневой модуль его не видит (свой go.mod), поэтому свой job.
  relay:
    name: Сервер связи
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: go vet и тесты с гонками
        working-directory: cmd/pcblock-relay
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go vet ./...
          go test -race -count=1 ./...

      - name: Фаззинг разбора тел (30 с)
        working-directory: cmd/pcblock-relay
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go test -run '^$' -fuzz FuzzDecodeBody -fuzztime 30s .

      - name: Образ — сборка и размер (не больше 20 МБ)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          docker build -f deploy/relay/Dockerfile -t pcblock-relay:ci .
          size=$(docker image inspect -f '{{.Size}}' pcblock-relay:ci)
          echo "Размер образа: $size байт"
          if [ "$size" -gt $((20 * 1024 * 1024)) ]; then
            echo "::error title=Образ сервера связи::Размер $size байт больше 20 МБ"
            exit 1
          fi
          user=$(docker image inspect -f '{{.Config.User}}' pcblock-relay:ci)
          [ "$user" = "65532:65532" ] || { echo "::error title=Образ сервера связи::Пользователь «$user», ждали 65532:65532"; exit 1; }

      # Запуск с теми же ограничениями, что в compose.yaml: память 64 МБ, только чтение, без привилегий.
      - name: Образ — запуск, здоровье, круг через curl, память (NFR-16)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          docker run -d --name relay --memory 64m --memory-swap 64m --pids-limit 64 --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v pcblock-relay-ci:/data -p 127.0.0.1:18080:8080 pcblock-relay:ci -trust-proxy
          U=http://127.0.0.1:18080
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' relay)
            [ "$st" = healthy ] && break
            sleep 1
          done
          echo "HEALTHCHECK: $st"
          [ "$st" = healthy ] || { echo "::error title=Сервер связи::HEALTHCHECK не healthy: $st"; exit 1; }
          curl -fsS "$U/healthz" | tee /dev/stderr | jq -e '.ok == true' >/dev/null

          # Круг: регистрация → код → привязка телефона, доставленная опросом → ответ компьютера.
          pc=$(curl -fsS -X POST -d '{}' "$U/v1/pc/register" | jq -er .pcToken)
          code=$(curl -fsS -X POST -H "Authorization: Bearer $pc" -d '{}' "$U/v1/pc/pair-code" | jq -er .code)
          curl -sS -X POST -d "{\"code\":\"$code\",\"kind\":\"pair1\",\"body\":{\"phonePub\":\"AAA\",\"name\":\"CI\"}}" \
            "$U/v1/phone/pair" > "$RUNNER_TEMP/pair.json" &
          pairpid=$!
          poll=$(curl -fsS -H "Authorization: Bearer $pc" "$U/v1/pc/poll?wait=10")
          echo "Опрос: $poll"
          id=$(jq -er '.messages[0].id' <<<"$poll")
          from=$(jq -er '.messages[0].from' <<<"$poll")
          jq -e '.messages[0].kind == "pair1" and .messages[0].body.phonePub == "AAA"' <<<"$poll" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer $pc" \
            -d "{\"to\":\"$from\",\"replyTo\":\"$id\",\"kind\":\"pair1r\",\"body\":{\"pcPub\":\"BBB\"}}" "$U/v1/pc/reply"
          wait "$pairpid"
          echo "Привязка: $(cat "$RUNNER_TEMP/pair.json")"
          jq -e '.reply.kind == "pair1r" and (.phoneToken | length) == 43' "$RUNNER_TEMP/pair.json" >/dev/null
          ph=$(jq -er .phoneToken "$RUNNER_TEMP/pair.json")
          curl -fsS -X POST -H "Authorization: Bearer $pc" -d '{"body":{"data":"R","sig":"S"}}' "$U/v1/pc/report"
          curl -fsS -H "Authorization: Bearer $ph" "$U/v1/phone/status" | tee /dev/stderr \
            | jq -e '.pcLastSeenMs > 0 and .report.data == "R"' >/dev/null

          # Перезапуск: учётные записи в томе сохраняются (запись в /data при --read-only работает).
          docker restart relay
          for i in $(seq 1 30); do curl -fsS "$U/healthz" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $ph" "$U/v1/phone/status" | jq -e '.report == null' >/dev/null

          limit=$(docker inspect -f '{{.HostConfig.Memory}}' relay)
          [ "$limit" = $((64 * 1024 * 1024)) ] || { echo "::error title=Сервер связи::Предел памяти $limit"; exit 1; }
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' relay | awk '{print $1}')
          bytes=$(numfmt --from=iec-i "${mem%B}")
          echo "Память контейнера: $mem ($bytes байт), предел 64 МБ"
          if [ "$bytes" -gt $((64 * 1024 * 1024)) ]; then
            echo "::error title=Сервер связи (NFR-16)::Память $mem больше 64 МБ"
            exit 1
          fi
          echo "::notice title=Сервер связи::Образ $(docker image inspect -f '{{.Size}}' pcblock-relay:ci) байт, память $mem"
      - name: Журнал контейнера
        if: always()
        run: docker logs relay 2>&1 | tail -n 50 || true
      - name: Ошибки — в пометки сборки (их видно без журнала)
        if: failure()
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Сервер связи"

  screens:
    name: Снимки экранов (браузер)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сценарии интерфейса со снимками
        working-directory: frontend
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          npm ci
          npx playwright install --with-deps chromium
          npx vite build
          npx playwright test
      - name: Ошибки — в пометки сборки (их видно без журнала)
        if: failure()
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Снимки экранов"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screens-browser-${{ github.sha }}
          path: frontend/screens/
          retention-days: 14
          if-no-files-found: ignore
      - name: Снимки — в ветку screenshots
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-screenshots.sh frontend/screens
