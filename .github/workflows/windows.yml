# Сборка на настоящей Windows (лестница R3): установщик, тесты Windows, окно программы,
# тихая установка и удаление. Минуты Windows в приватном репозитории дороже, поэтому
# запуск — только на Pull Request в main, на main (выпуск) и вручную; документы не запускают.
name: Сборка Windows

on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "plans/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "plans/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Что прогнать после сборки: пусто = обычная сборка, smoke = ранний смоук службы (tools/accept/smoke.ps1), accept = приёмка S1...S20, S25...S27, S33...S46, LE1, LE2, FB1, FB5, PROBE (tools/accept/run-all.ps1), probe = проба Brave (TestBraveProbe, M4 T0)"
        required: false
        default: ""
        type: string
      only:
        description: "С scenario=accept: какие сценарии прогнать, через запятую (например S1,S4); пусто = все"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: R3 установщик, окно, тесты Windows
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails CLI (версия из go.mod)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: NSIS для установщика
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress
          fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      # Полный список «18+» (RM4-3, D-67): зеркало UT1 на закреплённом коммите tools/adultlist/ut1.commit,
      # только папка blacklists/adult, вне дерева репозитория. Инструмент перезаписывает встроенный
      # internal/sites/adult/adult.bin перед wails build (в ветку файл не коммитится: шаг «Биндинги»
      # добавляет только frontend/wailsjs/go). Три домена входа идут в TestAdultListFull.
      # Кэш (B-52): папка списка по ключу коммита ut1.commit; при попадании клона нет, и выпуск не
      # зависит от доступности зеркала. Новый коммит в ut1.commit — новый ключ, список качается заново.
      - name: Кэш списка 18+ (UT1)
        id: ut1-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ut1-adult
          key: ut1-adult-${{ runner.os }}-${{ hashFiles('tools/adultlist/ut1.commit') }}
      - name: Полный список 18+ (UT1 на закреплённом коммите)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          commit=$(tr -d '[:space:]' < tools/adultlist/ut1.commit)
          adult="$RUNNER_TEMP/ut1-adult"
          if [ "${{ steps.ut1-cache.outputs.cache-hit }}" = "true" ] && [ -n "$(ls -A "$adult" 2>/dev/null)" ]; then
            echo "::notice title=Список 18+::из кэша, коммит $commit"
          else
            src="$RUNNER_TEMP/ut1"
            git init -q "$src"
            git -C "$src" remote add origin https://github.com/olbat/ut1-blacklists.git
            git -C "$src" sparse-checkout set blacklists/adult
            git -C "$src" fetch -q --depth 1 --filter=blob:none origin "$commit"
            git -C "$src" checkout -q FETCH_HEAD
            rm -rf "$adult"
            cp -r "$src/blacklists/adult" "$adult"
          fi
          ls -la "$adult"
          go run ./tools/adultlist -src "$adult" -out internal/sites/adult/adult.bin -sample "$RUNNER_TEMP/adult-sample.txt"
          echo "PCB_ADULT_SAMPLE=$(paste -sd, "$RUNNER_TEMP/adult-sample.txt")" >> "$GITHUB_ENV"

      - name: Сборка программы и установщика
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          wails build -clean -nsis -trimpath -ldflags "-s -w"

      # NFR-4: установщик не больше 40 МБ (с полным списком 18+ ожидание около 28 МБ).
      - name: Размер установщика (NFR-4 ≤ 40 МБ)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          inst=$(ls build/bin/*installer*.exe | head -1)
          size=$(stat -c %s "$inst")
          echo "::notice title=Размер установщика::$size байт ($inst)"
          if [ "$size" -gt 41943040 ]; then
            echo "::error title=Размер установщика::$size байт, NFR-4 не больше 41943040 (40 МБ)"
            exit 1
          fi

      # Биндинги Wails в песочнице агента не генерируются. При ручном запуске на рабочей ветке
      # сгенерированные файлы коммитятся в ветку (как go.sum в ci.yml, Ruling 22), в остальных
      # случаях расхождение роняет сборку.
      - name: Биндинги интерфейса совпадают с закоммиченными
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if [ -n "$(git status --porcelain frontend/wailsjs/go)" ]; then
            git status --porcelain frontend/wailsjs/go
            git diff -- frontend/wailsjs/go
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add frontend/wailsjs/go
              git commit -m "build: обновить биндинги Wails (wails build)"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "::notice title=Биндинги::frontend/wailsjs/go обновлены и закоммичены в ветку: сделайте git pull"
            else
              echo "::error title=Биндинги::frontend/wailsjs/go устарели: закоммить файлы, сгенерированные wails build"
              exit 1
            fi
          fi

      # Brave для пробы M4 T0 и приёмки сайтов (RM4-12): ставится только при scenario=accept или probe.
      # Сначала пакет choco, нет brave.exe — офлайн-установщик последнего стабильного выпуска с GitHub.
      # Адреса проб в hosts ведут на 127.0.0.1: из сети ничего не грузится. Есть brave.exe — тесты Go
      # получают PCB_BRAVE_PROBE=1 (TestBraveProbe).
      - name: Brave для пробы и приёмки
        if: github.event_name == 'workflow_dispatch' && (inputs.scenario == 'accept' || inputs.scenario == 'probe')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          find_brave() {
            for d in "$PROGRAMFILES" "${PROGRAMFILES} (x86)" "$LOCALAPPDATA"; do
              f="$(cygpath -u "$d")/BraveSoftware/Brave-Browser/Application/brave.exe"
              if [ -f "$f" ]; then echo "$f"; return 0; fi
            done
            return 1
          }
          how="choco"
          choco install brave -y --no-progress || echo "choco install brave: код $?"
          if ! exe=$(find_brave); then
            how="офлайн-установщик GitHub"
            tag=$(gh api repos/brave/brave-browser/releases/latest --jq .tag_name)
            echo "Последний стабильный выпуск Brave: $tag"
            gh release download "$tag" -R brave/brave-browser -p BraveBrowserStandaloneSetup.exe -D "$RUNNER_TEMP" --clobber
            "$RUNNER_TEMP/BraveBrowserStandaloneSetup.exe" /silent /install || echo "установщик Brave: код $?"
            for i in $(seq 1 60); do exe=$(find_brave) && break; sleep 5; done
          fi
          if ! exe=$(find_brave); then
            echo "::error title=Brave::brave.exe не найден после choco и офлайн-установщика"
            exit 1
          fi
          ver=$(powershell -NoProfile -Command "(Get-Item -LiteralPath '$(cygpath -w "$exe")').VersionInfo.FileVersion")
          echo "::notice title=Brave::$how: $(cygpath -w "$exe"), версия $ver"
          # Домены приёмки сайтов (M4 T10): пробы, «Запрещённые» и поддомен, «Учёба», YouTube и образец «18+»
          # сборки (PCB_ADULT_SAMPLE из шага «Полный список 18+» без IP: по IP hosts не работает, Brave ушёл бы
          # в сеть). Не больше 9 имён в строке: дальше Windows их может не читать.
          adult=$(printf '%s' "$PCB_ADULT_SAMPLE" | tr ',' '\n' | { grep -Ev '^[0-9.]+$' || true; } | tr '\n' ' ')
          hosts=/c/Windows/System32/drivers/etc/hosts
          printf '\r\n127.0.0.1 probe-site.test probe-two.test probe-app.test blocked-probe.test\r\n' >> "$hosts"
          printf '127.0.0.1 forbidden-site.test video.forbidden-site.test study-site.test youtube.com www.youtube.com\r\n' >> "$hosts"
          if [ -n "${adult// /}" ]; then printf '127.0.0.1 %s\r\n' "$adult" >> "$hosts"; else echo "PCB_ADULT_SAMPLE без доменов: «$PCB_ADULT_SAMPLE»"; fi
          echo "hosts: $(tail -n 3 "$hosts" | tr -d '\r' | paste -sd ';')"
          echo "PCB_BRAVE_PROBE=1" >> "$GITHUB_ENV"

      - name: Тесты Go на Windows
        env:
          PCB_ADULT_FULL: "1"
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          go test -count=1 -tags desktop,production $(go list ./... | grep -v -E '^pcblock$')

      # Сухой прогон наблюдателя процессов (RM3-8): тест TestWatcherDryRun пишет итог пометкой
      # ::notice в файл; здесь она выводится, чтобы попасть в пометки сборки и при зелёных тестах.
      - name: Сухой прогон наблюдателя (пометка)
        if: always()
        run: |
          f="$RUNNER_TEMP/pcb-watch-dryrun.txt"
          if [ -s "$f" ]; then
            cat "$f"
          else
            echo "::warning title=Сухой прогон наблюдателя::итог не записан: тест TestWatcherDryRun не дошёл до конца"
          fi

      # Список 18+ (RM4-3): TestAdultListFull пишет факты полного списка пометкой в файл, здесь она выводится.
      - name: Список 18+ (пометки)
        if: always()
        run: |
          f="$RUNNER_TEMP/pcb-adult.txt"
          if [ -s "$f" ]; then
            cat "$f"
          else
            echo "::warning title=Список 18+::итог не записан: тест TestAdultListFull не дошёл до конца"
          fi

      # Проба Brave (M4 T0): TestBraveProbe пишет факты пометками ::notice в файл, здесь они выводятся.
      - name: Проба Brave (пометки)
        if: always() && env.PCB_BRAVE_PROBE == '1'
        run: |
          f="$RUNNER_TEMP/pcb-brave-probe.txt"
          if [ -s "$f" ]; then
            cat "$f"
          else
            echo "::warning title=Проба Brave::факты не записаны: тест TestBraveProbe не дошёл до первого шага"
          fi

      - name: Ошибки — в пометки сборки (их видно без журнала)
        if: failure()
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Сборка Windows"
      - name: Окно открывается (снимок настоящего окна)
        shell: pwsh
        run: ./tools/win-window-screenshot.ps1 -ExePath build/bin/PCBlock.exe -Out win-screens/win-s00-window.png

      - name: Тихая установка и удаление
        shell: pwsh
        run: |
          $inst = Get-ChildItem build/bin -Filter "*installer*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inst) {
            Write-Host "::error::Установщик не собран. Содержимое build/bin:"
            Get-ChildItem build/bin -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("::error::  bin/" + $_.Name + " (" + $_.Length + " б)") }
            Write-Host "::error::Файлы build/windows (шаблоны NSIS):"
            Get-ChildItem build/windows -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("::error::  " + $_.FullName.Replace((Get-Location).Path + '\','')) }
            exit 1
          }
          Start-Process $inst.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:ProgramFiles" -Recurse -Filter "PCBlock.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::После установки PCBlock.exe не найден в Program Files"; exit 1 }
          Write-Host "Установлено: $($exe.FullName)"
          $dir = $exe.DirectoryName
          # Свой шаблон установщика (build/windows/installer/project.nsi), а не шаблон Wails: папка, служба, ярлык сброса пароля.
          if ($dir -ne (Join-Path $env:ProgramFiles "PCBlock")) { Write-Host "::error::Папка установки $dir, ждали $env:ProgramFiles\PCBlock"; exit 1 }
          # Лицензия списка 18+ рядом с программой (RM4-3, ТЗ 8.3.5 п. 3; project.nsi). Её удаление проверяет «осталось: папка» ниже.
          $lic = Join-Path $dir "LICENSE-UT1.txt"
          if (-not (Test-Path -LiteralPath $lic)) { Write-Host "::error title=Лицензия UT1::После установки нет $lic (project.nsi: File LICENSE-UT1.txt после wails.files)"; exit 1 }
          if (-not (Get-Content -LiteralPath $lic -Raw -Encoding UTF8).Contains("CC BY-SA 4.0")) { Write-Host "::error title=Лицензия UT1::В $lic ($((Get-Item -LiteralPath $lic).Length) б) нет «CC BY-SA 4.0»"; exit 1 }
          $svc = Get-Service -Name PCBlock -ErrorAction SilentlyContinue
          if (-not $svc -or $svc.Status -ne "Running") { Write-Host "::error::После тихой установки служба PCBlock не работает: $($svc.Status)"; exit 1 }
          $lnkDir = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"
          $lnk = Get-ChildItem $lnkDir -Filter "*сброс пароля родителя*.lnk" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lnk) { Write-Host "::error::Нет ярлыка сброса пароля в меню Пуск ($lnkDir)"; exit 1 }
          # В .lnk цель и ключи лежат строками UTF-16: читаем файл как есть, не через COM.
          # Смещение строки в файле может быть нечётным, поэтому читаем с обоих смещений и как ANSI.
          $lnkBytes = [IO.File]::ReadAllBytes($lnk.FullName)
          $lnkText = [Text.Encoding]::Unicode.GetString($lnkBytes) + [Text.Encoding]::Unicode.GetString($lnkBytes, 1, $lnkBytes.Length - 1) + [Text.Encoding]::Latin1.GetString($lnkBytes)
          if ($lnkText -notmatch [regex]::Escape("--reset-password") -or $lnkText -notmatch [regex]::Escape("PCBlock.exe")) {
            Write-Host "::error::Ярлык сброса пароля ведёт не туда: в $($lnk.FullName) ($($lnk.Length) б) нет --reset-password или PCBlock.exe"; exit 1
          }
          Write-Host "::notice title=Установка::$($exe.FullName); служба PCBlock работает; ярлык «$($lnk.BaseName)» ведёт на --reset-password; LICENSE-UT1.txt рядом с программой"
          $un = Join-Path $dir "uninstall.exe"
          if (-not (Test-Path $un)) { Write-Host "::error::Нет uninstall.exe в $dir"; exit 1 }
          Start-Process $un -ArgumentList "/S" -Wait
          # Деинсталлятор NSIS копирует себя во временную папку и завершается раньше удаления: ждём.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe.FullName) { Write-Host "::error::Программа не удалилась за 60 с"; exit 1 }
          # Ненастроенная программа удаляется без пароля (Ruling 21); следы проверяем циклом ожидания, а не сразу.
          $safeBoot = "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\PCBlock", "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\PCBlock"
          for ($i = 0; $i -lt 30; $i++) {
            $left = @()
            if (Get-Service -Name PCBlock -ErrorAction SilentlyContinue) { $left += "служба" }
            foreach ($k in $safeBoot) { if (Test-Path $k) { $left += "ключ $k" } }
            if (Get-ChildItem $lnkDir -Filter "*сброс пароля родителя*.lnk" -ErrorAction SilentlyContinue) { $left += "ярлык" }
            if (Test-Path $dir) { $left += "папка $dir" }
            if ($left.Count -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($left.Count -gt 0) { Write-Host "::error::После удаления осталось: $($left -join ', ')"; exit 1 }
          # Статистика без просьбы не удаляется (FR-4): папка данных на месте. Для следующих шагов убираем её.
          $dataDir = Join-Path $env:ProgramData "PCBlock"
          if (-not (Test-Path (Join-Path $dataDir "pcblock.db"))) { Write-Host "::error::База пропала без просьбы её удалять"; exit 1 }
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "::notice title=Удаление::программа, служба, ключи SafeBoot и ярлык убраны, база осталась на месте"
          Write-Host "Удалено начисто"

      # Настроенная программа (тестовый режим, пароль задан): удаление без пароля и с неверным паролем отказывает,
      # с верным удаляет и оставляет статистику, с /DELETEDATA удаляет и её. Полный S26 пишет задача T16.
      - name: Удаление настроенной программы (пароль и «Удалить статистику»)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Get-ChildItem build/bin -Filter "*installer*.exe" | Select-Object -First 1
          $pw = "PcbUninst-2026"
          $testKey = "HKLM:\SOFTWARE\PCBlock\TestMode"
          $data = Join-Path $env:RUNNER_TEMP "pcb-uninst-data"
          $prog = Join-Path $env:ProgramFiles "PCBlock"
          $exe = Join-Path $prog "PCBlock.exe"
          $un = Join-Path $prog "uninstall.exe"
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $gateLog = Join-Path $data "logs\boot.log"

          function Wait-Until([scriptblock]$Cond, [int]$Seconds, [string]$What) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while (-not (& $Cond)) {
              if ((Get-Date) -gt $deadline) { throw "За $Seconds с не дождались: $What" }
              Start-Sleep -Milliseconds 500
            }
          }
          function Install-Program([bool]$Setup) {
            Start-Process $inst.FullName -ArgumentList "/S" -Wait
            if (-not (Test-Path $exe)) { throw "Установка не положила PCBlock.exe в $prog" }
            New-Item -Path $testKey -Force | Out-Null
            New-ItemProperty -Path $testKey -Name DataDir -Value $data -PropertyType String -Force | Out-Null
            New-ItemProperty -Path $testKey -Name ClockSpeed -Value 1 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $testKey -Name TestChildSID -Value $sid -PropertyType String -Force | Out-Null
            Restart-Service -Name PCBlock -Force
            Wait-Until { (Get-Service -Name PCBlock).Status -eq "Running" } 35 "служба в тестовом режиме"
            if ($Setup) {
              $out = Join-Path $env:RUNNER_TEMP "pcb-uninst-setup.json"
              $p = Start-Process $exe -ArgumentList "--test-setup", "--password=$pw", "--user=$env:USERNAME", "--out=$out" -Wait -PassThru -WindowStyle Hidden
              if ($p.ExitCode -ne 0) { throw "Первичная настройка не удалась: код $($p.ExitCode) $(Get-Content $out -Raw -ErrorAction SilentlyContinue)" }
            }
          }
          # Ждёт, пока деинсталлятор дойдёт до проверки и запишет её итог в журнал запуска.
          function Wait-GateAnswer([string]$Pattern) {
            Wait-Until { (Test-Path $gateLog) -and (Select-String -Path $gateLog -Pattern $Pattern -Quiet) } 60 "ответ проверки удаления '$Pattern'"
            Wait-Until { -not (Get-Process -Name "Au_" -ErrorAction SilentlyContinue) } 60 "завершение деинсталлятора"
          }
          function Assert-Installed([string]$When) {
            if (-not (Test-Path $exe)) { throw "${When}: программа удалена, а должна остаться" }
            if ((Get-Service -Name PCBlock -ErrorAction SilentlyContinue).Status -ne "Running") { throw "${When}: служба не работает, а должна работать" }
          }
          function Assert-Removed([string]$When) {
            Wait-Until { -not (Test-Path $exe) } 60 "${When}: PCBlock.exe удалён"
            Wait-Until { -not (Get-Service -Name PCBlock -ErrorAction SilentlyContinue) } 30 "${When}: служба удалена"
          }

          try {
            Install-Program $true

            Start-Process $un -ArgumentList "/S" -Wait
            Wait-GateAnswer "не указан"
            Assert-Installed "удаление без пароля"

            Start-Process $un -ArgumentList "/S", "/PASSWORD=Wrong-Pass-1" -Wait
            Wait-GateAnswer "Неверный пароль"
            Assert-Installed "удаление с неверным паролем"

            Start-Process $un -ArgumentList "/S", "/PASSWORD=$pw" -Wait
            Assert-Removed "верный пароль"
            if (-not (Test-Path (Join-Path $data "pcblock.db"))) { throw "Статистика пропала без /DELETEDATA" }
            Write-Host "::notice title=Удаление с паролем::без пароля и с неверным отказ, с верным удалено, статистика осталась"

            # Повторная установка: статистика и пароль вернулись, служба снова работает.
            Install-Program $false
            Start-Process $un -ArgumentList "/S", "/PASSWORD=$pw", "/DELETEDATA" -Wait
            Assert-Removed "верный пароль и /DELETEDATA"
            Wait-Until { -not (Test-Path $data) } 30 "папка данных удалена по /DELETEDATA"
            Write-Host "::notice title=Удалить статистику::/DELETEDATA удалил и папку данных"
          } catch {
            Write-Host "::error title=Удаление настроенной программы::$($_.Exception.Message)"
            Get-Content $gateLog -Tail 15 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::error title=boot.log::$_" }
            exit 1
          } finally {
            if (Test-Path $un) { Start-Process $un -ArgumentList "/S", "/PASSWORD=$pw", "/DELETEDATA" -Wait }
            Get-Process -Name "PCBlock", "Au_" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $testKey -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\PCBlock", "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\PCBlock" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $data, (Join-Path $env:ProgramData "PCBlock") -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Смоук службы (ручной запуск, scenario=smoke)
        id: smoke
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'smoke'
        shell: pwsh
        run: ./tools/accept/smoke.ps1 -InstallerDir build/bin -LogPath "$env:RUNNER_TEMP/ci.log"
      - name: Смоук службы, ошибки — в пометки сборки
        if: failure() && steps.smoke.conclusion == 'failure'
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Смоук службы"

      # Приёмка на настоящей Windows: S1...S15 (S12...S15 — программы и игры M3: тестовые программы в папке WatchDir, RM3-8), S25...S27, S34...S37, LE1 и LE2 (выходы с экрана блокировки), FB1 (конец сеанса), FB5 (выход другого сеанса при отключённом сеансе ребёнка), S41 (последняя минута идёт по часам при выходе и перезапуске службы), S38 (скрытая программа), S40 (своё название программы), S39 (вкладки «Итогов»: время каждой программы), S42 (периоды «Итогов»: прошлые дни подкладывает тестовая команда TestSeedDay), S43 (перерыв на отдых: часы ядра ×20, «вышел» — TestSession), S44 (запрещённые программы не в «Итогах»: прошлый день — TestSeedDay), S45 (запрещённая, запустившаяся сама, закрыта без плашки и нарушения, раз в день в журнал; ручной запуск из программы на переднем плане — с плашкой: передний план подменой TestGuard foreground), S16…S18 (сайты в настоящем Brave раннера: «18+» из образца сборки, поддомен «Запрещённых», учёба на сайте и подмена домена TestGuard domain, лимит «Видео и соцсети»; домены в hosts ведут на 127.0.0.1, шаг «Brave для пробы и приёмки»), S19 (другие браузеры: копии тестовой программы с именами msedge.exe, chrome.exe, firefox.exe в WatchDir), S20 (правила Brave в ветке реестра ребёнка, кнопка VPN по UIA, запрещённый домен на сервере 127.0.0.1:8765), S46 (одна строка приложения магазина: поддельные папки версий в TestMode\StoreRoot, повторы «до обновления» — TestSeedPrograms, перезапуск службы), S33 (смена пользователя), каждый на свежей установке и свежей папке данных.
      # Идёт по одному сценарию за раз (одна учётка раннера, одна служба, один экран). Снимки sNN-*.png уходят
      # в ветку screenshots (папка screens/<ветка>).
      - name: Приёмка M1 (ручной запуск, scenario=accept)
        id: accept
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'accept'
        shell: pwsh
        env:
          PCB_ACCEPT_SHOTS: ${{ github.workspace }}/accept-screens
        run: |
          $only = @("${{ inputs.only }}" -split "[,\s]+" | Where-Object { $_ })
          ./tools/accept/run-all.ps1 -InstallerDir build/bin -LogPath "$env:RUNNER_TEMP/ci.log" -Only $only
      - name: Приёмка M1, ошибки — в пометки сборки
        if: failure() && steps.accept.conclusion == 'failure'
        run: bash tools/annotate-errors.sh "$RUNNER_TEMP/ci.log" "Приёмка M1"
      - name: Приёмка M1, снимки — в ветку screenshots
        if: always() && steps.accept.conclusion != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENS_BRANCH_NAME: ${{ github.ref_name }}
        run: bash tools/push-screenshots.sh accept-screens
      - uses: actions/upload-artifact@v6
        if: always() && steps.accept.conclusion != 'skipped'
        with:
          name: accept-screens-${{ github.sha }}
          path: accept-screens/
          retention-days: 14
          if-no-files-found: ignore

      - name: Версия и дата
        id: meta
        run: |
          echo "ver=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' internal/version/version.go | head -1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d '+3 hours' +%d.%m.%Y)" >> "$GITHUB_OUTPUT"
      - name: Файлы выпуска
        run: |
          mkdir -p out
          inst=$(ls build/bin/*installer*.exe | head -1)
          cp "$inst" "out/PCBlock-${{ steps.meta.outputs.ver }}-setup.exe"
          cp "$inst" out/PCBlock-setup.exe
          cp build/bin/PCBlock.exe "out/PCBlock-${{ steps.meta.outputs.ver }}.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: PCBlock-${{ steps.meta.outputs.ver }}-${{ github.sha }}
          path: |
            out/PCBlock-${{ steps.meta.outputs.ver }}-setup.exe
            out/PCBlock-${{ steps.meta.outputs.ver }}.exe
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screens-windows-${{ github.sha }}
          path: win-screens/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: wails-build-assets-${{ github.sha }}
          path: build/windows/
          retention-days: 7

      - name: Снимок окна — в ветку screenshots
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-screenshots.sh win-screens

      # --- выпуск: только сборки основной ветки
      - name: Описание выпуска из CHANGELOG.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V="${{ steps.meta.outputs.ver }}"
          awk -v v="## $V " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Изменения — в CHANGELOG.md" > notes.md
          printf '\n---\nСборка %s от %s. Скачать: PCBlock-%s-setup.exe (или PCBlock-setup.exe — всегда последняя версия).\n' \
            "${GITHUB_SHA::7}" "${{ steps.meta.outputs.date }}" "$V" >> notes.md
      - name: Публикация в Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.meta.outputs.ver }} от ${{ steps.meta.outputs.date }}"
          body_path: notes.md
          make_latest: true
          overwrite_files: true
          files: |
            out/PCBlock-${{ steps.meta.outputs.ver }}-setup.exe
            out/PCBlock-setup.exe
